[project]
name = "ai-bib-helper"
version = "0.1.0"
description = "BibTeX from DBLP and official publisher exports, for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aibib = "aibib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibib"]
